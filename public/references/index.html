<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>stegassette</title>
    <style>
      :root {
        --bg: #0d0d0d;
        --surface: #111111;
        --surface2: #161616;
        --border: #222222;
        --border2: #333333;
        --text: #bbbbbb;
        --dim: #555555;
        --ghost: #2e2e2e;
        --accent: #3355bb;
        --accent-hi: #99aaee;
        --font: monospace;
        --fs: 11px;
        --lh: 1.5;
        --gap: 10px;
        --gap-sm: 4px;
        --max-w: 1040px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: var(--fs)/var(--lh) var(--font);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        min-height: 100vh;
        gap: 12px;
      }
      h1 {
        font-size: var(--fs);
        color: var(--ghost);
        letter-spacing: 0.12em;
      }
      section {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--gap);
        width: 100%;
        max-width: var(--max-w);
      }
      section[hidden] {
        display: none;
      }

      /* drop zones */
      .drop-pair {
        display: flex;
        gap: var(--gap);
        width: 100%;
      }
      .drop {
        flex: 1;
        border: 1px dashed var(--border);
        padding: 16px 20px;
        color: var(--ghost);
        cursor: pointer;
        text-align: center;
        user-select: none;
        transition:
          border-color 0.12s,
          color 0.12s;
      }
      .drop:hover,
      .drop.over {
        border-color: var(--dim);
        color: var(--dim);
      }
      .drop.ready {
        border-color: var(--accent);
        color: var(--accent-hi);
      }
      .drop-lbl {
        display: block;
      }
      .drop-sub {
        display: block;
        font-size: 10px;
        color: var(--ghost);
        margin-top: 2px;
      }
      .drop.ready .drop-sub {
        color: var(--dim);
      }
      input[type="file"] {
        display: none;
      }

      /* buttons */
      button {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--dim);
        font: var(--fs) var(--font);
        padding: 4px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover:not(:disabled) {
        border-color: var(--border2);
        color: var(--text);
      }
      button:disabled {
        opacity: 0.28;
        cursor: default;
      }

      /* form controls */
      select,
      input[type="text"],
      input[type="number"] {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        font: var(--fs) var(--font);
        padding: 3px 5px;
      }
      select {
        cursor: pointer;
      }
      :is(select, input):focus {
        outline: none;
        border-color: var(--border2);
      }

      .status {
        color: var(--ghost);
        width: 100%;
        min-height: 1em;
      }

      /* settings panel — two columns */
      .settings-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 32px;
        width: 100%;
      }
      .sg {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .sg-hdr {
        color: var(--ghost);
        font-size: 10px;
        letter-spacing: 0.1em;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 3px;
      }
      .sf {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
      }
      .sf > label:first-child {
        color: var(--dim);
        min-width: 76px;
        flex-shrink: 0;
      }
      .sf-hint {
        color: var(--dim);
        font-size: 10px;
        margin-left: 2px;
      }

      /* waveform */
      .wave-section {
        display: none;
        flex-direction: column;
        gap: 3px;
        width: 100%;
      }
      .wave-section.on {
        display: flex;
      }
      .wave-canvas {
        display: block;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      #waveCoarse {
        height: 52px;
      }
      #waveFine {
        height: 72px;
      }

      /* dual-range */
      .dr {
        position: relative;
        height: 18px;
        width: 100%;
      }
      .dr::before {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        height: 1px;
        background: var(--border2);
        pointer-events: none;
      }
      .dr-fill {
        position: absolute;
        top: 50%;
        height: 2px;
        transform: translateY(-50%);
        background: var(--accent);
        pointer-events: none;
      }
      .dr input[type="range"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        pointer-events: none;
      }
      .dr input[type="range"]::-webkit-slider-runnable-track {
        background: transparent;
        height: 2px;
      }
      .dr input[type="range"]::-moz-range-track {
        background: transparent;
        height: 2px;
      }
      .dr input[type="range"]::-webkit-slider-thumb {
        pointer-events: all;
        -webkit-appearance: none;
        appearance: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--text);
        cursor: col-resize;
        margin-top: -4px;
      }
      .dr input[type="range"]::-moz-range-thumb {
        pointer-events: all;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--text);
        cursor: col-resize;
        border: none;
      }
      .dr input[type="range"]:focus {
        outline: none;
      }

      .trim-row {
        display: flex;
        align-items: center;
        gap: var(--gap-sm);
        flex-wrap: wrap;
      }
      .trim-row label {
        color: var(--dim);
        font-size: 10px;
      }

      /* additional entries */
      .addl-row {
        display: flex;
        align-items: center;
        gap: var(--gap-sm);
        width: 100%;
        padding: 4px 6px;
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .addl-row textarea {
        flex: 1;
        resize: vertical;
        font: var(--fs) var(--font);
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 2px 4px;
        min-height: 42px;
      }
      .addl-info {
        color: var(--dim);
        font-size: 10px;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .entries-hdr {
        display: flex;
        align-items: center;
        gap: var(--gap-sm);
        font-size: 10px;
        color: var(--dim);
        letter-spacing: 0.05em;
      }

      /* action row */
      .action-row {
        display: flex;
        align-items: center;
        gap: var(--gap);
        flex-wrap: wrap;
        width: 100%;
      }

      /* player section */
      .player-hdr {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        border-top: 1px solid var(--border);
        padding-top: var(--gap);
      }
      .player-hdr-lbl {
        color: var(--ghost);
        font-size: 10px;
        letter-spacing: 0.1em;
        flex: 1;
      }
      #displayRow {
        display: none;
        flex-wrap: wrap;
        gap: 12px;
        width: 100%;
        align-items: flex-start;
      }
      .disp-col {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1 1 260px;
        max-width: 460px;
      }
      .disp-lbl {
        color: var(--ghost);
        font-size: 10px;
        letter-spacing: 0.1em;
      }
      .img-wrap {
        position: relative;
        border: 1px solid var(--border);
        max-width: 100%;
      }
      canvas.display {
        display: block;
        width: 100%;
        height: auto;
      }
      #ov {
        position: absolute;
        inset: 0;
        width: 100%;
        height: auto;
        pointer-events: none;
      }
      #clock {
        color: var(--dim);
      }
      .pbar {
        display: flex;
        align-items: center;
        gap: var(--gap);
        flex-wrap: wrap;
      }

      /* entry list */
      #pentryList {
        width: 100%;
        display: none;
      }
      .entry-card {
        width: 100%;
        border: 1px solid var(--border);
        background: var(--surface);
        margin-bottom: 4px;
      }
      .ec-hdr {
        display: flex;
        align-items: center;
        gap: var(--gap-sm);
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
        font-size: 10px;
      }
      .ec-mt {
        color: var(--accent-hi);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ec-nm {
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 140px;
      }
      .ec-sz {
        color: var(--dim);
        margin-left: auto;
        white-space: nowrap;
        padding-left: 4px;
      }
      .ec-dl {
        color: var(--dim);
        text-decoration: none;
        padding: 2px 8px;
        border: 1px solid var(--border);
        margin-left: 4px;
        background: var(--surface2);
      }
      .ec-dl:hover {
        color: var(--text);
        border-color: var(--border2);
      }
      .ec-body {
        padding: 6px 8px;
      }
      .ec-body pre {
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 200px;
        overflow-y: auto;
        font-size: 10px;
        color: var(--text);
      }
      .ec-body img {
        max-width: 100%;
        display: block;
      }
      .ec-hint {
        color: var(--dim);
        font-size: 10px;
      }

      /* frame picker */
      .frame-picker-section {
        display: none;
        flex-direction: column;
        gap: 3px;
        width: 100%;
      }
      .frame-picker-section.on {
        display: flex;
      }
      #framePreview {
        display: block;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .scrub-range {
        display: block;
        width: 100%;
        height: 18px;
        appearance: none;
        -webkit-appearance: none;
        background: var(--surface);
        border: 1px solid var(--border);
        margin: 0;
        padding: 0;
        cursor: col-resize;
      }
      .scrub-range::-webkit-slider-runnable-track {
        background: var(--border2);
        height: 2px;
      }
      .scrub-range::-moz-range-track {
        background: var(--border2);
        height: 2px;
      }
      .scrub-range::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent-hi);
        margin-top: -5px;
        cursor: col-resize;
      }
      .scrub-range::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent-hi);
        border: none;
        cursor: col-resize;
      }
      .scrub-range:focus {
        outline: none;
      }
      .frame-thumbs {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gap-sm);
        width: 100%;
      }
      .frame-thumb {
        position: relative;
        border: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }
      .frame-thumb img {
        display: block;
        width: 80px;
        height: 45px;
        object-fit: cover;
      }
      .frame-thumb-del {
        position: absolute;
        top: 1px;
        right: 1px;
        background: rgba(0, 0, 0, 0.65);
        border: none;
        color: var(--dim);
        font: 9px var(--font);
        padding: 1px 3px;
        cursor: pointer;
        line-height: 1;
      }
      .frame-thumb-del:hover {
        color: var(--text);
      }
      .frame-thumb-num {
        position: absolute;
        bottom: 1px;
        left: 3px;
        font-size: 9px;
        color: var(--dim);
        pointer-events: none;
      }

      /* global drag highlight */
      body.drag-audio #adrop {
        border-color: var(--dim);
        color: var(--dim);
      }
      body.drag-image #idrop {
        border-color: var(--dim);
        color: var(--dim);
      }
      /* encoder layout: roomy main column + controls sidebar */
      .enc-layout {
        display: flex;
        gap: 16px;
        width: 100%;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .enc-main {
        flex: 1 1 440px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--gap);
      }
      .enc-side {
        flex: 0 0 320px;
        max-width: 320px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: sticky;
        top: 8px;
      }
      .enc-side .settings-panel {
        grid-template-columns: 1fr;
        min-width: 0;
      }
      .enc-side .sg,
      .enc-side .sf {
        min-width: 0;
      }
      /* let control rows wrap instead of overflowing the narrow sidebar */
      .enc-side .sf {
        flex-wrap: wrap;
      }
      .enc-side .sf > label:first-child {
        min-width: 60px;
      }
      .enc-side select,
      .enc-side input[type="number"],
      .enc-side input[type="text"] {
        max-width: 100%;
        min-width: 0;
      }
      .enc-side .chan-row {
        flex-wrap: wrap;
        max-width: 100%;
      }
      .enc-side .chan-row select {
        flex: 1 1 auto;
      }
      @media (max-width: 760px) {
        .enc-side {
          flex-basis: 100%;
          max-width: 100%;
          position: static;
        }
      }
      /* jobs queue panel */
      .jobs-panel {
        border: 1px solid var(--border);
        background: var(--surface);
        margin-bottom: var(--gap-sm);
      }
      .jobs-hdr {
        display: flex;
        align-items: center;
        gap: var(--gap-sm);
        padding: 4px 6px;
        border-bottom: 1px solid var(--border);
      }
      .jobs-hdr .grow {
        flex: 1;
      }
      .jobs-list {
        max-height: 200px;
        overflow-y: auto;
      }
      .job-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
      }
      .job-item:hover {
        background: #1a1a1a;
      }
      .job-item.sel {
        background: #23314a;
      }
      .job-item .ji-idx {
        color: var(--dim);
        min-width: 18px;
        text-align: right;
      }
      .job-item .ji-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .job-item .ji-meta {
        color: var(--dim);
      }
      .job-item .ji-files {
        font-size: 10px;
      }
      .ji-ok {
        color: #6e6;
      }
      .ji-miss {
        color: #e66;
      }
      /* channel plan slot rows */
      .chan-plan-rows {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin: 2px 0 2px 0;
      }
      .chan-row {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
      }
      .chan-row .ch-dot {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        display: inline-block;
      }
      .chan-row.dim {
        opacity: 0.4;
      }
      .chan-row button {
        padding: 0 5px;
      }
    </style>
  </head>
  <body>
    <h1>stegassette</h1>

    <!-- ═══ ENCODER ═══ -->
    <section id="encSection">
      <!-- jobs queue: drop a jobs array (jobs/*.json) to load every item -->
      <div id="jobsPanel" class="jobs-panel" hidden>
        <div class="jobs-hdr">
          <span id="jobsTitle" class="grow">jobs</span>
          <button id="jobsClear">✕</button>
        </div>
        <div id="jobsList" class="jobs-list"></div>
        <div
          style="
            padding: 4px 6px;
            font-size: 10px;
            color: var(--dim);
            border-top: 1px solid var(--border);
          "
        >
          <span id="jobsMsg"
            >drop the referenced images/audio too (any time) to auto-attach by
            filename</span
          >
        </div>
      </div>

      <div class="drop-pair">
        <div id="idrop" class="drop">
          <span class="drop-lbl">image / video</span>
          <span class="drop-sub">PNG · JPG · MP4 · MOV…</span>
        </div>
        <input id="ifi" type="file" accept="image/*,video/*" />
        <div id="adrop" class="drop">
          <span class="drop-lbl">audio</span>
          <span class="drop-sub">any format</span>
        </div>
        <input id="afi" type="file" accept="audio/*,video/*" />
      </div>

      <!-- video frame picker -->
      <div class="frame-picker-section" id="framePickerSection">
        <video id="frameVideo" style="display: none" preload="auto"></video>
        <canvas id="framePreview"></canvas>
        <input
          type="range"
          id="vScrub"
          class="scrub-range"
          min="0"
          max="10000"
          value="0"
          step="1"
        />
        <div
          style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"
        >
          <span
            id="vTimeEl"
            style="color: var(--dim); font-size: 10px; min-width: 72px"
          ></span>
          <button id="captureFrameBtn">+ snapshot</button>
          <button id="clearFramesBtn" style="display: none">clear all</button>
          <label style="margin-left: auto; color: var(--dim)">layout</label>
          <select id="mosaicLayout">
            <option value="cols">cols</option>
            <option value="rows">rows</option>
            <option value="2x2">2×2</option>
            <option value="3x3">3×3</option>
            <option value="4x4">4×4</option>
          </select>
        </div>
        <div id="frameThumbs" class="frame-thumbs"></div>
      </div>

      <!-- waveform editor -->
      <div class="wave-section" id="waveSection">
        <canvas id="waveCoarse" class="wave-canvas"></canvas>
        <div class="dr" id="zoomDr">
          <div class="dr-fill" id="zoomFill"></div>
          <input
            type="range"
            id="zoomS"
            min="0"
            max="10000"
            value="0"
            step="1"
          />
          <input
            type="range"
            id="zoomE"
            min="0"
            max="10000"
            value="10000"
            step="1"
          />
        </div>
        <canvas id="waveFine" class="wave-canvas"></canvas>
        <div class="dr" id="trimDr">
          <div class="dr-fill" id="trimFill"></div>
          <input
            type="range"
            id="trimS"
            min="0"
            max="10000"
            value="0"
            step="1"
          />
          <input
            type="range"
            id="trimE"
            min="0"
            max="10000"
            value="10000"
            step="1"
          />
        </div>
        <div class="trim-row">
          <label>start (ms)</label>
          <input
            type="number"
            id="trimStartN"
            style="width: 70px"
            step="1"
            min="0"
          />
          <label>end (ms)</label>
          <input
            type="number"
            id="trimEndN"
            style="width: 70px"
            step="1"
            min="0"
          />
          <button id="prevPlayBtn">▶</button>
          <button id="prevStopBtn">■</button>
          <span id="trimDur" style="color: var(--dim); font-size: 10px"></span>
        </div>
      </div>

      <!-- settings panel -->
      <div class="settings-panel">
        <div class="sg">
          <div class="sg-hdr">audio</div>
          <div class="sf">
            <label>rate</label>
            <input
              type="number"
              id="eSr"
              style="width: 72px"
              min="3000"
              max="65535"
            />
          </div>
          <div class="sf">
            <label>channels</label>
            <select id="eCh">
              <option value="1">mono</option>
              <option value="2">stereo</option>
            </select>
          </div>
          <div class="sf" id="eLayoutWrap">
            <label>layout</label>
            <select id="eLayout">
              <option value="planar">planar</option>
              <option value="interleaved">interleaved</option>
              <option value="block">block</option>
            </select>
            <input
              id="eBlockSize"
              type="number"
              min="1"
              value="64"
              style="width: 44px; display: none"
              title="block size (samples)"
            />
          </div>
          <div class="sf">
            <label>bits</label>
            <select id="eBits">
              <option value="8">8</option>
              <option value="16" selected>16</option>
              <option value="24">24</option>
            </select>
          </div>
          <div class="sf">
            <label>direction</label>
            <select id="eDir">
              <option value="fwd">fwd</option>
              <option value="rev">rev</option>
            </select>
          </div>
          <div class="sf">
            <label>mode</label>
            <select id="eMode">
              <option value="relabel">relabel</option>
              <option value="resample">resample</option>
            </select>
            <span id="speedHint" class="sf-hint"></span>
          </div>
          <div class="sf">
            <label>normalize</label>
            <select id="eNorm">
              <option value="off">off</option>
              <option value="0">0 dBFS</option>
              <option value="-1">-1 dBFS</option>
              <option value="-3">-3 dBFS</option>
            </select>
          </div>
        </div>

        <div class="sg">
          <div class="sg-hdr">steg</div>
          <div class="sf">
            <label>traversal</label>
            <select id="eTraversal">
              <option>raster</option>
              <option>boustrophedon</option>
              <option>spiral</option>
              <option>angle</option>
              <option>fisher-yates</option>
              <option>center-out</option>
              <option>hilbert</option>
              <option>polar</option>
              <option>bayer</option>
            </select>
            <span
              id="travParams"
              style="display: none; align-items: center; gap: 4px"
            ></span>
          </div>
          <div class="sf">
            <label>keymap</label>
            <select id="eKeymap">
              <option value="adjacent">adjacent</option>
              <option value="poles">poles</option>
              <option value="mirror-x">mirror-x</option>
              <option value="mirror-y">mirror-y</option>
              <option value="offset">offset</option>
              <option value="rotate">rotate</option>
            </select>
            <span
              id="keymapParams"
              style="display: none; align-items: center; gap: 4px"
            ></span>
          </div>
          <!-- channel plan: maps 1:1 to JSON { pack, channels:[{ch,combine}] }.
               each row is one slot (an active R/G/B channel + its combine op);
               row order = slot order. aligned caps the count to bytes/sample. -->
          <div class="sf">
            <label>channels</label>
            <select id="ePack">
              <option value="packed">packed</option>
              <option value="aligned">aligned</option>
              <option value="mono">mono</option>
            </select>
            <button id="chanAddBtn" type="button" title="add a channel slot">
              + slot
            </button>
            <span style="color: var(--dim)">all</span>
            <select id="eAllCombine" title="set every slot's combine"></select>
            <span id="packHint" class="sf-hint"></span>
          </div>
          <div id="chanPlanRows" class="chan-plan-rows"></div>
          <div class="sf">
            <span id="reconLabel" class="sf-hint"></span>
          </div>
          <div class="sf">
            <label>aspect</label>
            <select id="eAspect">
              <option value="original">original</option>
              <option value="1:1">1:1</option>
              <option value="16:9">16:9</option>
              <option value="4:3">4:3</option>
              <option value="9:16">9:16</option>
              <option value="3:4">3:4</option>
              <option value="custom">custom</option>
            </select>
            <span
              id="eAspectCustom"
              style="display: none; align-items: center; gap: 4px"
            >
              <input
                type="number"
                id="eAspectW"
                style="width: 40px"
                min="1"
                value="16"
                step="1"
              />
              <span style="color: var(--dim)">:</span>
              <input
                type="number"
                id="eAspectH"
                style="width: 40px"
                min="1"
                value="9"
                step="1"
              />
            </span>
          </div>
          <div class="sf">
            <label>border +</label>
            <input
              type="number"
              id="eBorder"
              style="width: 48px"
              min="0"
              value="0"
              step="any"
              title="≥1 = extra pixels; 0–0.99 = fraction of output width"
            />
          </div>
        </div>
      </div>

      <!-- additional entries -->
      <div id="addlSection">
        <div class="entries-hdr">
          <span>entries</span>
          <button id="addTextBtn">+ text</button>
          <button id="addFileBtn">+ file</button>
          <button id="addTrackBtn">+ audio track</button>
        </div>
        <div id="addlRows"></div>
        <div id="trackRows"></div>
      </div>

      <!-- encode action -->
      <div class="action-row">
        <button id="encBtn" disabled>encode</button>
        <button id="dlBtn" style="display: none">↓ download</button>
        <button id="copyJsonBtn" title="copy this job as a jobs/*.json entry">
          copy as json
        </button>
        <span id="sizeHint" style="color: var(--dim); font-size: 10px"></span>
        <div
          id="estats"
          class="status"
          style="flex: 1; text-align: right"
        ></div>
      </div>
    </section>

    <!-- ═══ PLAYER (appears when STGC loaded) ═══ -->
    <section id="playerSection" hidden>
      <div class="player-hdr">
        <span class="player-hdr-lbl">player</span>
        <button id="reconBtn" disabled>↓ reconstruct</button>
        <button id="pCloseBtn">✕ close</button>
      </div>
      <div id="displayRow">
        <div class="disp-col">
          <div class="disp-lbl">encoded · plays → reconstructed</div>
          <div class="img-wrap" id="imgWrap">
            <canvas id="imgC" class="display"></canvas>
            <canvas id="ov"></canvas>
          </div>
        </div>
        <div class="disp-col" id="reconCol">
          <div class="disp-lbl">reconstructed</div>
          <div class="img-wrap">
            <canvas id="reconC" class="display"></canvas>
          </div>
        </div>
      </div>
      <div class="pbar" id="pbar" style="display: none">
        <button id="playBtn" disabled>▶ play</button>
        <button id="stopBtn" disabled>■ stop</button>
        <span id="clock">0:00 / 0:00</span>
      </div>
      <div id="pstatus" class="status"></div>
      <div id="pentryList"></div>
    </section>

    <script src="lib/steg-core.js"></script>
    <script src="lib/config.js"></script>
    <script>
      "use strict";

      const DR_MAX = 10000;

      // ═══════════════════════════════════════════════════════════════════
      // PLAYER
      // ═══════════════════════════════════════════════════════════════════

      let pst = null,
        pactx = null,
        psrc = null,
        psrcs = [],
        pt0 = 0,
        praf = null;

      const playerSection = document.getElementById("playerSection");
      const displayRow = document.getElementById("displayRow");
      const imgWrap = document.getElementById("imgWrap");
      const imgC = document.getElementById("imgC");
      const ovC = document.getElementById("ov");
      const reconCol = document.getElementById("reconCol");
      const reconC = document.getElementById("reconC");
      const rc = reconC.getContext("2d");
      const pbar = document.getElementById("pbar");
      const playBtn = document.getElementById("playBtn");
      const stopBtn = document.getElementById("stopBtn");
      const reconBtn = document.getElementById("reconBtn");
      const clockEl = document.getElementById("clock");
      const pstatus = document.getElementById("pstatus");
      const pCloseBtn = document.getElementById("pCloseBtn");
      const ic = imgC.getContext("2d");
      const oc = ovC.getContext("2d");

      playBtn.addEventListener("click", pplay);
      stopBtn.addEventListener("click", () => pstop());
      reconBtn.addEventListener("click", reconstruct);
      pCloseBtn.addEventListener("click", () => {
        pstop();
        pst = null;
        playerSection.setAttribute("hidden", "");
        displayRow.style.display = "none";
        pbar.style.display = "none";
        pstatus.textContent = "";
        document.getElementById("pentryList").style.display = "none";
      });

      const tt = (s) => {
        const m = (s / 60) | 0;
        return m + ":" + ((s | 0) % 60).toString().padStart(2, "0");
      };

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderEntryList(entries) {
        const list = document.getElementById("pentryList");
        list.innerHTML = "";
        if (!entries || !entries.length) {
          list.style.display = "none";
          return;
        }
        list.style.display = "block";
        for (const entry of entries) {
          const isAudio = entry.mimetype.startsWith("audio/");
          const isText =
            entry.mimetype.startsWith("text/") &&
            entry.mimetype !== "text/html";
          const isImg = entry.mimetype.startsWith("image/");
          const sz = entry.data.length;
          const szStr =
            sz < 1024
              ? sz + "B"
              : sz < 1048576
                ? (sz / 1024).toFixed(1) + "KB"
                : (sz / 1048576).toFixed(1) + "MB";
          const blob = new Blob([entry.data], {
            type: entry.mimetype.split(";")[0].trim(),
          });
          const url = URL.createObjectURL(blob);
          const ext = (entry.mimetype.split("/")[1] || "bin")
            .split(";")[0]
            .trim();
          const fname = escHtml(entry.name || "entry." + ext);
          let bodyHtml;
          if (isAudio) {
            const { bits, rate, channels } = StegCore.parseAudioMime(
              entry.mimetype,
            );
            bodyHtml = `<div class="ec-hint">${bits}bit · ${rate}Hz · ${channels}ch · plays via controls above</div>`;
          } else if (isText) {
            const text = new TextDecoder().decode(entry.data);
            bodyHtml = `<pre>${escHtml(text)}</pre>`;
          } else if (isImg) {
            bodyHtml = `<img src="${url}" alt="">`;
          } else {
            bodyHtml = `<div class="ec-hint">download to view</div>`;
          }
          const card = document.createElement("div");
          card.className = "entry-card";
          card.innerHTML =
            `<div class="ec-hdr">` +
            `<span class="ec-mt">${escHtml(entry.mimetype)}</span>` +
            (entry.name
              ? `<span class="ec-nm">${escHtml(entry.name)}</span>`
              : "") +
            `<span class="ec-sz">${szStr}</span>` +
            `<a href="${url}" download="${fname}" class="ec-dl">↓</a>` +
            `</div><div class="ec-body">${bodyHtml}</div>`;
          list.appendChild(card);
        }
      }

      function pload(file) {
        pstatus.textContent = "reading image…";
        playerSection.removeAttribute("hidden");
        playBtn.disabled = stopBtn.disabled = true;
        reconBtn.disabled = true;
        pstop(false);
        document.getElementById("pentryList").style.display = "none";
        Promise.all([
          createImageBitmap(file),
          createImageBitmap(file, { colorSpaceConversion: "none" }),
        ])
          .then(([dispBmp, rawBmp]) => {
            const W = rawBmp.width,
              H = rawBmp.height;
            const raw = Object.assign(document.createElement("canvas"), {
              width: W,
              height: H,
            });
            const rctx = raw.getContext("2d", { willReadFrequently: true });
            rctx.drawImage(rawBmp, 0, 0);
            const px = rctx.getImageData(0, 0, W, H).data;
            rawBmp.close();
            // Rasterize dispBmp to a plain canvas immediately so the GPU-backed
            // ImageBitmap isn't held across long synchronous computations (e.g.
            // angle path sort for large images) where Chrome may reclaim idle
            // GPU textures, causing a later drawImage to throw "source detached".
            const dispCanvas = Object.assign(document.createElement("canvas"), { width: W, height: H });
            dispCanvas.getContext("2d").drawImage(dispBmp, 0, 0);
            dispBmp.close();
            const encImg = new StegCore.Img(W, H, new Uint8Array(px));
            let decResult;
            try {
              decResult = StegCore.decodeContainer(encImg, encImg);
            } catch (e) {
              pstatus.textContent = "✗ " + e.message;
              return;
            }
            const { entries, opts } = decResult;
            const B = opts.borderWidth;
            pstatus.textContent = "building path…";
            setTimeout(() => {
              const IW = W - 2 * B,
                IH = H - 2 * B;
              // Index-based path: Uint32Array of interior-local linear indices
              // (v = ly*IW + lx) — 4 bytes/pixel vs ~64 for an [x,y] tuple, the
              // difference between a few MB and multiple GB on large images.
              // Data pixel coords: dx = (v % IW) + B, dy = (v / IW | 0) + B.
              const pathIdx = StegCore.getPathIndices(
                IW,
                IH,
                opts.traversal,
                opts.params || {},
              );
              const audioEntries = entries.filter((e) =>
                e.mimetype.startsWith("audio/"),
              );
              if (!audioEntries.length) {
                pstatus.textContent = "decoded — no audio entry";
                renderEntryList(entries);
                displayRow.style.display = "flex";
                reconCol.style.display = "none"; // no audio → no reconstruction
                const sc2 = Math.min(
                  1,
                  (window.innerWidth - 32) / W,
                  (window.innerHeight * 0.72) / H,
                );
                imgC.width = Math.round(W * sc2);
                imgC.height = Math.round(H * sc2);
                ovC.width = imgC.width;
                ovC.height = imgC.height;
                ic.drawImage(dispCanvas, 0, 0, imgC.width, imgC.height);
                return;
              }
              pstatus.textContent = "processing audio…";
              // bytes the channel plan writes per data pixel (was fixed 3; mono=1)
              const bytesPerPixel = opts.plan ? (opts.plan.bytesPerPixel || opts.plan.slots.length) : 3;
              setTimeout(() => {
                const tracks = audioEntries.map((audioEntry) => {
                  const { bits, rate, channels, layout, blockSize } =
                    StegCore.parseAudioMime(audioEntry.mimetype);
                  const rawF32 = StegCore.toFloat32(audioEntry.data, bits);
                  const planarF32 = StegCore.unlayoutChannels({
                    f32: rawF32,
                    layout,
                    channels,
                    blockSize,
                  });
                  const dur = planarF32.length / (rate * channels);
                  const audioStartPxIdx = Math.floor(
                    audioEntry.dataOffset / bytesPerPixel,
                  );
                  const audioEndPxIdx = Math.ceil(
                    (audioEntry.dataOffset + audioEntry.data.length) /
                      bytesPerPixel,
                  );
                  const pathLen = audioEndPxIdx - audioStartPxIdx;
                  const revealOrder = StegCore.computeRevealOrder({
                    pathLen,
                    channels,
                    bits,
                    layout,
                    blockSize,
                    bytesPerPixel,
                  });
                  return {
                    audioF32: planarF32,
                    audioSr: rate,
                    audioCh: channels,
                    audioBits: bits,
                    layout,
                    blockSize,
                    dur,
                    audioStartPxIdx,
                    audioEndPxIdx,
                    revealOrder,
                    fillIdx: -1,
                    loopCount: 0,
                  };
                });
                const { dur } = tracks[0];
                const {
                  audioSr: rate,
                  audioCh: channels,
                  audioBits: bits,
                } = tracks[0];
                const sc = Math.min(
                  1,
                  (window.innerWidth - 32) / W,
                  (window.innerHeight * 0.72) / H,
                );
                const dW = Math.round(W * sc),
                  dH = Math.round(H * sc);
                imgC.width = dW;
                imgC.height = dH;
                ovC.width = dW;
                ovC.height = dH;
                const encCanvas = Object.assign(document.createElement("canvas"), { width: dW, height: dH });
                const encCtx = encCanvas.getContext("2d");
                encCtx.drawImage(dispCanvas, 0, 0, dW, dH);
                // Clear border pixels from encCanvas; they'll show reconData from ic instead
                const bPx = B * sc;
                encCtx.clearRect(0, 0, dW, bPx);
                encCtx.clearRect(0, dH - bPx, dW, bPx);
                encCtx.clearRect(0, 0, bPx, dH);
                encCtx.clearRect(dW - bPx, 0, bPx, dH);
                const ps = Math.max(1, sc);
                const keyMapFn = StegCore.KEYMAP[opts.keyMap];
                // Coordinate helpers derive pixel positions from the index path
                // on demand, so we never materialize per-pixel tuple arrays.
                // dataXY(pi) → [dx, dy] absolute; keyXY(pi) → [kx, ky] absolute.
                const dataXY = (pi) => {
                  const v = pathIdx[pi];
                  return [(v % IW) + B, ((v / IW) | 0) + B];
                };
                const keyXY = (pi) => {
                  const v = pathIdx[pi];
                  const lx = v % IW,
                    ly = (v / IW) | 0;
                  const [klx, kly] = keyMapFn(lx, ly, IW, IH, opts.params || {});
                  return [klx + B, kly + B];
                };
                // per-channel combine from the plan; channels with no slot are
                // passthrough (carry no data → keep the encoded/source value).
                const chCombine = [null, null, null];
                const planSlots = opts.plan
                  ? opts.plan.slots
                  : [0, 1, 2].map((c) => ({ ch: c, combine: opts.combine }));
                for (const s of planSlots) chCombine[s.ch] = s.combine;
                // These ops leave the key (non-data) pixel untouched, so the
                // original cover value survives exactly in it. difference / noise /
                // echo move BOTH pixels and can only be rebuilt per data+key pair.
                const KEY_PRESERVING = new Set([
                  "xor",
                  "additive",
                  "subtractive",
                  "bitshift",
                  "midpoint",
                  "signed",
                  "veil",
                  "whisper",
                ]);
                const realOnly = chCombine.every(
                  (c) => c == null || KEY_PRESERVING.has(c),
                );
                // mixed plan: at least one key-preserving channel alongside a
                // difference/noise/echo one. The full-res pass runs (below), then
                // we decimate it to half-res keeping only the real/restored key
                // pixels — so even mixed plans avoid fabricated data pixels.
                const hasKeyPreserving = chCombine.some(
                  (c) => c != null && KEY_PRESERVING.has(c),
                );
                let reconData, reconW, reconH;
                if (realOnly) {
                  // Real-only reconstruction: rather than fabricating each data
                  // pixel from its 4 neighbours (the old path — a checkerboard
                  // blur), drop them. Every 2×2 block keeps its two real key
                  // pixels — the (even,even) and (odd,odd) diagonal corners, which
                  // were never overwritten — averaged into one output pixel. Half
                  // resolution, but made only of true cover pixels (no guessing).
                  reconW = (W + 1) >> 1;
                  reconH = (H + 1) >> 1;
                  reconData = new Uint8ClampedArray(reconW * reconH * 4);
                  for (let by = 0; by < reconH; by++) {
                    for (let bx = 0; bx < reconW; bx++) {
                      const x0 = bx << 1,
                        y0 = by << 1;
                      const tl = (y0 * W + x0) * 4;
                      const x1 = x0 + 1,
                        y1 = y0 + 1;
                      const hasBR = x1 < W && y1 < H;
                      const br = hasBR ? (y1 * W + x1) * 4 : tl;
                      const o = (by * reconW + bx) * 4;
                      for (let c = 0; c < 3; c++) {
                        // some ops stash audio bits in key low bits; mask them out
                        const KEY_MASK = { midpoint: 0xfe, veil: 0xfc, whisper: 0xf0 };
                        const m = KEY_MASK[chCombine[c]] ?? 0xff;
                        reconData[o + c] = hasBR
                          ? ((px[tl + c] & m) + (px[br + c] & m) + 1) >> 1
                          : px[tl + c] & m;
                      }
                      reconData[o + 3] = 255;
                    }
                  }
                } else {
                  reconW = W;
                  reconH = H;
                  reconData = new Uint8ClampedArray(px);
                  // encode stops once the data stream is exhausted, so only the
                  // first nEnc data pixels were touched — the rest stay original.
                  // Reconstructing past nEnc would corrupt those (esp. echo, where
                  // key^data on an untouched pair = origKey^origData = noise).
                  const nEnc = Math.min(
                    pathIdx.length,
                    Math.ceil((opts.interiorByteLength || 0) / bytesPerPixel),
                  );
                  for (let pi = 0; pi < nEnc; pi++) {
                    const [dx, dy] = dataXY(pi);
                    const eo = (dy * W + dx) * 4;
                    for (let c = 0; c < 3; c++) {
                      if (chCombine[c] == null) {
                        reconData[eo + c] = px[eo + c]; // passthrough = source
                        continue;
                      }
                      const m = chCombine[c] === "midpoint" ? 0xfe : 0xff;
                      let acc = 0,
                        n = 0;
                      for (const [nx, ny] of [
                        [dx - 1, dy],
                        [dx + 1, dy],
                        [dx, dy - 1],
                        [dx, dy + 1],
                      ]) {
                        if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                          acc += px[(ny * W + nx) * 4 + c] & m;
                          n++;
                        }
                      }
                      reconData[eo + c] = n ? Math.round(acc / n) : 0;
                    }
                  }
                  // restore key-pixel symmetry per channel for midpoint/difference/echo
                  for (let i = 0; i < nEnc; i++) {
                    const [dx, dy] = dataXY(i),
                      [kx, ky] = keyXY(i);
                    const doff = (dy * W + dx) * 4,
                      koff = (ky * W + kx) * 4;
                    for (let c = 0; c < 3; c++) {
                      if (chCombine[c] === "midpoint") {
                        reconData[koff + c] &= 0xfe;
                      } else if (chCombine[c] === "difference") {
                        let sp = px[koff + c],
                          dp = px[doff + c];
                        if (sp < dp) sp += 256;
                        const mid = Math.round((sp - dp) / 2 + dp) & 0xff;
                        reconData[doff + c] = mid;
                        reconData[koff + c] = mid;
                      } else if (chCombine[c] === "echo") {
                        // origKey = newKey ^ audio, and audio = data pixel → key ^ data
                        reconData[koff + c] = px[koff + c] ^ px[doff + c];
                      }
                    }
                  }
                  // echo: the first pass interpolated data pixels from the *encoded*
                  // neighbors, but with echo those neighbors are noisy (origKey^audio).
                  // Now that keys are restored exactly, re-interpolate from the clean
                  // values. (Bounded to nEnc so the untouched tail stays original.)
                  if (chCombine.some((c) => c === "echo")) {
                    for (let pi = 0; pi < nEnc; pi++) {
                      const [dx, dy] = dataXY(pi);
                      const eo = (dy * W + dx) * 4;
                      for (let c = 0; c < 3; c++) {
                        if (chCombine[c] !== "echo") continue;
                        let acc = 0,
                          n = 0;
                        for (const [nx, ny] of [
                          [dx - 1, dy],
                          [dx + 1, dy],
                          [dx, dy - 1],
                          [dx, dy + 1],
                        ]) {
                          if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                            acc += reconData[(ny * W + nx) * 4 + c];
                            n++;
                          }
                        }
                        if (n) reconData[eo + c] = Math.round(acc / n);
                      }
                    }
                  }
                  // Mixed plan: decimate the full-res recon to half-res, sampling
                  // only the two key pixels per 2×2 block (the (even,even)+(odd,odd)
                  // diagonal). Those hold real values for key-preserving channels
                  // and restored values for difference/echo — never the fabricated
                  // data pixels — so the result is all-real/restored at half res.
                  if (hasKeyPreserving) {
                    const rw = (W + 1) >> 1,
                      rh = (H + 1) >> 1;
                    const half = new Uint8ClampedArray(rw * rh * 4);
                    for (let by = 0; by < rh; by++) {
                      for (let bx = 0; bx < rw; bx++) {
                        const x0 = bx << 1,
                          y0 = by << 1;
                        const tl = (y0 * W + x0) * 4;
                        const x1 = x0 + 1,
                          y1 = y0 + 1;
                        const hasBR = x1 < W && y1 < H;
                        const br = hasBR ? (y1 * W + x1) * 4 : tl;
                        const o = (by * rw + bx) * 4;
                        for (let c = 0; c < 3; c++)
                          half[o + c] = hasBR
                            ? (reconData[tl + c] + reconData[br + c] + 1) >> 1
                            : reconData[tl + c];
                        half[o + 3] = 255;
                      }
                    }
                    reconData = half;
                    reconW = rw;
                    reconH = rh;
                  }
                }
                // Draw reconData as permanent base layer on ic; encoded image as overlay on oc.
                // reconData lives at its native resolution (full W×H, or half for
                // the real-only path) — drawn scaled up to the display canvas.
                const tmpRec = Object.assign(document.createElement("canvas"), {
                  width: reconW,
                  height: reconH,
                });
                tmpRec
                  .getContext("2d")
                  .putImageData(
                    new ImageData(new Uint8ClampedArray(reconData), reconW, reconH),
                    0,
                    0,
                  );
                // smooth scaling so the reveal animation doesn't look blocky
                // (half-res base scales up; full-res may scale down on big images).
                ic.imageSmoothingEnabled = true;
                ic.drawImage(tmpRec, 0, 0, dW, dH);
                oc.drawImage(encCanvas, 0, 0);
                // Static reconstructed-image preview beside the encoded one, at the
                // recon's native resolution (CSS scales the element to column width).
                reconC.width = reconW;
                reconC.height = reconH;
                rc.putImageData(
                  new ImageData(new Uint8ClampedArray(reconData), reconW, reconH),
                  0,
                  0,
                );
                reconCol.style.display = "";
                displayRow.style.display = "flex";
                pbar.style.display = "flex";
                clockEl.textContent = "0:00 / " + tt(dur);
                playBtn.disabled = false;
                reconBtn.disabled = false;
                const travArgStr =
                  opts.traversal === "angle"
                    ? ` (a=${opts.params?.a ?? 1} b=${opts.params?.b ?? 1})`
                    : opts.traversal === "fisher-yates"
                      ? ` (seed=${opts.params?.seed ?? "?"})`
                      : "";
                const trackStr =
                  tracks.length > 1 ? `  ·  ${tracks.length} tracks` : "";
                pstatus.textContent =
                  `${W}×${H}  ·  B=${B}  ·  ${opts.traversal}${travArgStr}  ·  ${opts.combine}  ·  ${opts.keyMap}` +
                  `  ·  ${bits}bit ${rate}Hz ${channels}ch  ·  ${tt(dur)}${trackStr}`;
                const audioEndPxIdx = Math.max(...tracks.map((t) => t.audioEndPxIdx));
                const audioStartPxIdx = Math.min(...tracks.map((t) => t.audioStartPxIdx));
                pst = {
                  opts,
                  entries,
                  tracks,
                  pathIdx,
                  ps,
                  reconData,
                  reconW,
                  reconH,
                  px,
                  audioEndPxIdx,
                  audioStartPxIdx,
                  W,
                  H,
                  B,
                  IW,
                  IH,
                  sc,
                  dur,
                  encCanvas,
                  loopCount: 0,
                  fillIdx: -1,
                };
                renderEntryList(entries);
              }, 20);
            }, 20);
          })
          .catch((e) => {
            pstatus.textContent = "✗ " + e.message;
          });
      }

      // Clear the overlay rect for the data pixel + its key pixel at path
      // position `pi`, computing scaled coords on the fly from the index path
      // (no precomputed coords/keyCoords arrays — keeps big files in memory).
      function clearOverlayAt(st, pi) {
        const { pathIdx, IW, IH, B, sc, ps, opts } = st;
        const v = pathIdx[pi];
        const lx = v % IW,
          ly = (v / IW) | 0;
        oc.clearRect((lx + B) * sc, (ly + B) * sc, ps, ps);
        const [klx, kly] = StegCore.KEYMAP[opts.keyMap](lx, ly, IW, IH, opts.params || {});
        oc.clearRect((klx + B) * sc, (kly + B) * sc, ps, ps);
      }

      function fillNonAudioPixels(st) {
        const { audioStartPxIdx, audioEndPxIdx, pathIdx } = st;
        // Clear pre-audio pixels (entry table bytes)
        for (let i = 0; i < audioStartPxIdx; i++) clearOverlayAt(st, i);
        // Clear post-audio pixels (image larger than audio payload)
        for (let i = audioEndPxIdx; i < pathIdx.length; i++)
          clearOverlayAt(st, i);
      }

      function pplay() {
        if (!pst) return;
        if (!pactx) pactx = new AudioContext();
        if (pactx.state === "suspended") pactx.resume();
        pstop(false);
        const { tracks, encCanvas } = pst;
        pt0 = pactx.currentTime + 0.01;
        psrcs = [];
        for (const track of tracks) {
          const { audioF32, audioSr, audioCh } = track;
          const buf = pactx.createBuffer(
            audioCh,
            (audioF32.length / audioCh) | 0,
            audioSr,
          );
          for (let ch = 0; ch < audioCh; ch++) {
            const d = buf.getChannelData(ch);
            const off = ch * d.length;
            for (let i = 0; i < d.length; i++) d[i] = audioF32[off + i];
          }
          const src = pactx.createBufferSource();
          src.buffer = buf;
          src.loop = true;
          src.connect(pactx.destination);
          src.start(pt0);
          psrcs.push(src);
        }
        psrc = psrcs[0];
        oc.drawImage(encCanvas, 0, 0);
        pst.loopCount = 0;
        pst.fillIdx = -1;
        for (const t of tracks) {
          t.fillIdx = -1;
          t.loopCount = 0;
        }
        fillNonAudioPixels(pst);
        playBtn.disabled = true;
        stopBtn.disabled = false;
        praf = requestAnimationFrame(pframe);
      }

      function pstop(resetUI = true) {
        for (const src of psrcs) {
          try {
            src.stop();
          } catch (_) {}
        }
        psrcs = [];
        psrc = null;
        if (praf) {
          cancelAnimationFrame(praf);
          praf = null;
        }
        if (pst && pst.encCanvas) {
          oc.drawImage(pst.encCanvas, 0, 0);
          pst.fillIdx = -1;
        } else {
          oc.clearRect(0, 0, ovC.width, ovC.height);
        }
        if (resetUI && pst) {
          playBtn.disabled = false;
          stopBtn.disabled = true;
          clockEl.textContent = "0:00 / " + tt(pst.dur);
        }
      }

      function reconstruct() {
        if (!pst) return;
        const { reconData, reconW, reconH } = pst;
        const off = Object.assign(document.createElement("canvas"), {
          width: reconW,
          height: reconH,
        });
        off
          .getContext("2d")
          .putImageData(
            new ImageData(new Uint8ClampedArray(reconData), reconW, reconH),
            0,
            0,
          );
        off.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          Object.assign(document.createElement("a"), {
            href: url,
            download: "reconstructed.png",
          }).click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, "image/png");
      }

      function pframe() {
        if (!pst || !psrc) return;
        const { dur, encCanvas, tracks } = pst;
        const raw = Math.max(0, pactx.currentTime - pt0);
        const primaryLoopN = dur > 0 ? Math.floor(raw / dur) : 0;
        if (primaryLoopN > pst.loopCount) {
          pst.loopCount = primaryLoopN;
          oc.drawImage(encCanvas, 0, 0);
          fillNonAudioPixels(pst);
          for (const t of tracks) {
            t.fillIdx = -1;
            t.loopCount = 0;
          }
        }
        clockEl.textContent = tt(dur > 0 ? raw % dur : raw) + " / " + tt(dur);
        for (const track of tracks) {
          const tDur = track.dur;
          if (tDur <= 0) continue;
          const tLoopN = Math.floor(raw / tDur);
          if (tLoopN > track.loopCount) {
            track.loopCount = tLoopN;
            track.fillIdx = -1;
          }
          const elapsed = raw % tDur;
          const pathLen = track.audioEndPxIdx - track.audioStartPxIdx;
          const revealIdx = Math.min(
            Math.floor((elapsed / tDur) * pathLen),
            pathLen - 1,
          );
          if (revealIdx + 1 > track.fillIdx) {
            const startI = Math.max(0, track.fillIdx);
            for (let i = startI; i <= revealIdx; i++) {
              const pi = track.audioStartPxIdx + track.revealOrder[i];
              clearOverlayAt(pst, pi);
            }
            track.fillIdx = revealIdx + 1;
          }
        }
        praf = requestAnimationFrame(pframe);
      }

      // ═══════════════════════════════════════════════════════════════════
      // ENCODER
      // ═══════════════════════════════════════════════════════════════════

      let encImgFile = null;
      let encAudioBuf = null;
      let encAudioName = null;
      let encActx = null;
      let encVideoFile = null;
      let encFrameCanvases = [];
      let encFrameBlobUrl = null;
      let vScrubT = 0;
      let trimAbsS = 0,
        trimAbsE = 0;
      let zoomF0 = 0,
        zoomF1 = 1;
      let prevSrc = null,
        prevRaf = null,
        prevGen = 0;
      let lastBlobUrl = null;

      const idrop = document.getElementById("idrop");
      const ifi = document.getElementById("ifi");
      const adrop = document.getElementById("adrop");
      const afi = document.getElementById("afi");
      const waveSection = document.getElementById("waveSection");
      const addlRows = document.getElementById("addlRows");
      const trackRows = document.getElementById("trackRows");
      const addTextBtn = document.getElementById("addTextBtn");
      const addFileBtn = document.getElementById("addFileBtn");
      const addTrackBtn = document.getElementById("addTrackBtn");
      const waveCoarse = document.getElementById("waveCoarse");
      const waveFine = document.getElementById("waveFine");
      const zoomS = document.getElementById("zoomS");
      const zoomE = document.getElementById("zoomE");
      const zoomFill = document.getElementById("zoomFill");
      const trimS = document.getElementById("trimS");
      const trimE = document.getElementById("trimE");
      const trimFill = document.getElementById("trimFill");
      const trimStartN = document.getElementById("trimStartN");
      const trimEndN = document.getElementById("trimEndN");
      const trimDurEl = document.getElementById("trimDur");
      const prevPlayBtn = document.getElementById("prevPlayBtn");
      const prevStopBtn = document.getElementById("prevStopBtn");
      const eSrEl = document.getElementById("eSr");
      const eChEl = document.getElementById("eCh");
      const eLayoutEl = document.getElementById("eLayout");
      const eBlockSizeEl = document.getElementById("eBlockSize");
      const eLayoutWrap = document.getElementById("eLayoutWrap");
      const eBitsEl = document.getElementById("eBits");
      const eDirEl = document.getElementById("eDir");
      const eModeEl = document.getElementById("eMode");
      const eNormEl = document.getElementById("eNorm");
      const speedHint = document.getElementById("speedHint");
      const sizeHint = document.getElementById("sizeHint");
      const eTraversal = document.getElementById("eTraversal");
      const eKeymap = document.getElementById("eKeymap");
      const travParams = document.getElementById("travParams");
      const encBtn = document.getElementById("encBtn");
      const dlBtn = document.getElementById("dlBtn");
      const estats = document.getElementById("estats");
      const framePickerSection = document.getElementById("framePickerSection");
      const frameVideoEl = document.getElementById("frameVideo");
      const framePreviewEl = document.getElementById("framePreview");
      const vScrub = document.getElementById("vScrub");
      const vTimeEl = document.getElementById("vTimeEl");
      const captureFrameBtn = document.getElementById("captureFrameBtn");
      const clearFramesBtn = document.getElementById("clearFramesBtn");
      const mosaicLayoutEl = document.getElementById("mosaicLayout");
      const frameThumbsEl = document.getElementById("frameThumbs");
      const eAspect = document.getElementById("eAspect");
      const eAspectCustom = document.getElementById("eAspectCustom");
      const eAspectWEl = document.getElementById("eAspectW");
      const eAspectHEl = document.getElementById("eAspectH");
      const eBorderEl = document.getElementById("eBorder");
      const reconLabel = document.getElementById("reconLabel");

      // ── channel plan controls ─────────────────────────────────────────
      // One ordered list of slots == the JSON `channels` array. Each slot is a
      // distinct active channel (R/G/B) + its combine op; row order = slot order.
      // `pack` is the only other field. There is no separate global combine —
      // "all" is just a bulk setter over the rows.
      const ePack = document.getElementById("ePack");
      const packHint = document.getElementById("packHint");
      const chanPlanRows = document.getElementById("chanPlanRows");
      const eAllCombine = document.getElementById("eAllCombine");
      const chanAddBtn = document.getElementById("chanAddBtn");
      const CH_COLOR = { r: "#e66", g: "#6e6", b: "#66e" };

      eAllCombine.innerHTML = StegConfig.ENUMS.combine
        .map((n) => `<option>${n}</option>`)
        .join("");

      // chanPlan is the source of truth: [{ ch:"r"|"g"|"b", combine }]
      let chanPlan = ["r", "g", "b"].map((ch) => ({ ch, combine: "xor" }));

      function bytesPerSampleUI() {
        return Math.min(Math.max(1, (parseInt(eBitsEl.value) || 16) >> 3), 3);
      }
      // aligned forces exactly N distinct slots (N = bytes/sample)
      function syncAlignedCount() {
        if (ePack.value !== "aligned") return;
        const n = bytesPerSampleUI();
        while (chanPlan.length > n) chanPlan.pop();
        while (chanPlan.length < n) {
          const used = new Set(chanPlan.map((s) => s.ch));
          const next = ["r", "g", "b"].find((c) => !used.has(c));
          chanPlan.push({ ch: next, combine: eAllCombine.value });
        }
      }

      function onPlanChange() {
        updateReconLabel?.();
        updateSizeHint?.();
      }

      function renderChanPlan() {
        if (ePack.value === "mono") {
          chanPlanRows.innerHTML = "";
          chanAddBtn.disabled = true;
          chanAddBtn.style.opacity = 0.4;
          packHint.textContent = "mono · 1 byte/pixel → R=G=B (luminance ghost)";
          return;
        }
        syncAlignedCount();
        const aligned = ePack.value === "aligned";
        chanPlanRows.innerHTML = "";
        chanPlan.forEach((slot, i) => {
          const row = document.createElement("div");
          row.className = "chan-row";
          const chSel = StegConfig.ENUMS.channel
            .map(
              (c) =>
                `<option value="${c}"${c === slot.ch ? " selected" : ""}>${c.toUpperCase()}</option>`,
            )
            .join("");
          const cmSel = StegConfig.ENUMS.combine
            .map(
              (n) =>
                `<option${n === slot.combine ? " selected" : ""}>${n}</option>`,
            )
            .join("");
          row.innerHTML =
            `<span class="ch-dot" style="background:${CH_COLOR[slot.ch]}"></span>` +
            `<select class="cr-ch">${chSel}</select>` +
            `<select class="cr-cm">${cmSel}</select>` +
            `<button class="cr-up" type="button" title="move up"${i === 0 ? " disabled" : ""}>▲</button>` +
            `<button class="cr-dn" type="button" title="move down"${i === chanPlan.length - 1 ? " disabled" : ""}>▼</button>` +
            `<button class="cr-rm" type="button" title="remove"${chanPlan.length <= 1 || aligned ? " disabled" : ""}>✕</button>`;
          row.querySelector(".cr-ch").addEventListener("change", (e) => {
            const v = e.target.value;
            const j = chanPlan.findIndex((s, k) => k !== i && s.ch === v);
            if (j >= 0) chanPlan[j].ch = slot.ch; // keep channels distinct (swap)
            slot.ch = v;
            renderChanPlan();
            onPlanChange();
          });
          row.querySelector(".cr-cm").addEventListener("change", (e) => {
            slot.combine = e.target.value;
            renderChanPlan();
            onPlanChange();
          });
          row.querySelector(".cr-up").addEventListener("click", () => {
            [chanPlan[i - 1], chanPlan[i]] = [chanPlan[i], chanPlan[i - 1]];
            renderChanPlan();
            onPlanChange();
          });
          row.querySelector(".cr-dn").addEventListener("click", () => {
            [chanPlan[i + 1], chanPlan[i]] = [chanPlan[i], chanPlan[i + 1]];
            renderChanPlan();
            onPlanChange();
          });
          row.querySelector(".cr-rm").addEventListener("click", () => {
            chanPlan.splice(i, 1);
            renderChanPlan();
            onPlanChange();
          });
          chanPlanRows.appendChild(row);
        });
        chanAddBtn.disabled = aligned || chanPlan.length >= 3;
        chanAddBtn.style.opacity = chanAddBtn.disabled ? 0.4 : 1;
        packHint.textContent = aligned
          ? `aligned · ${chanPlan.length} ch/sample (1 sample → 1 pixel)`
          : `packed · ${chanPlan.length}/3 ch · ${Math.round((chanPlan.length / 3) * 100)}% density`;
      }

      chanAddBtn.addEventListener("click", () => {
        if (chanPlan.length >= 3 || ePack.value === "aligned") return;
        const used = new Set(chanPlan.map((s) => s.ch));
        const next = ["r", "g", "b"].find((c) => !used.has(c));
        chanPlan.push({ ch: next, combine: eAllCombine.value });
        renderChanPlan();
        onPlanChange();
      });
      eAllCombine.addEventListener("change", () => {
        for (const s of chanPlan) s.combine = eAllCombine.value;
        renderChanPlan();
        onPlanChange();
      });
      ePack.addEventListener("change", () => {
        renderChanPlan();
        onPlanChange();
      });
      eBitsEl.addEventListener("change", () => {
        renderChanPlan();
        onPlanChange();
      });
      renderChanPlan();

      // channels array + pack, straight from chanPlan
      function gatherChannelPlan() {
        if (ePack.value === "mono") return { pack: "mono", channels: null };
        return {
          pack: ePack.value,
          channels: chanPlan.map((s) => ({ ch: s.ch, combine: s.combine })),
        };
      }
      // representative combine — for the recon-quality hint + clean-JSON default
      function representativeCombine() {
        return chanPlan[0] ? chanPlan[0].combine : "xor";
      }
      // true when the plan is the simple default (packed, r,g,b, one combine)
      function isSimplePlan() {
        if (ePack.value === "mono") return false;
        return (
          ePack.value === "packed" &&
          chanPlan.length === 3 &&
          chanPlan.every((s, i) => s.ch === ["r", "g", "b"][i]) &&
          chanPlan[0].combine === chanPlan[1].combine &&
          chanPlan[1].combine === chanPlan[2].combine
        );
      }
      // load chanPlan from a parsed channels array (indices or letters)
      function setChanPlan(slots) {
        const letters = ["r", "g", "b"];
        chanPlan = slots.map((s) => ({
          ch: typeof s.ch === "number" ? letters[s.ch] : s.ch,
          combine: s.combine || "xor",
        }));
        if (!chanPlan.length) chanPlan = [{ ch: "r", combine: "xor" }];
        eAllCombine.value = chanPlan[0].combine;
        renderChanPlan();
      }

      // ── canonical config (same schema as jobs/*.json) ─────────────────
      // applyConfig writes a parsed job back into the form; gatherJobJSON (below)
      // is the inverse, serializing the form. Units are ms (trim) for batch jobs.
      function setSel(el, val) {
        if (el && val != null) el.value = String(val);
      }
      function applyConfig(job) {
        // audio settings live in the first audio entry (batch format) or top-level (ui format)
        const audioEnt = jobAudioEntry(job);
        const j = { ...StegConfig.DEFAULTS, ...job, ...(audioEnt || {}) };
        setSel(eSrEl, j.sr);
        setSel(eChEl, j.ch);
        setSel(eBitsEl, j.bits);
        setSel(eDirEl, j.dir);
        setSel(eModeEl, j.mode);
        {
          const nd = StegConfig.resolveNormalize(j.normalize);
          eNormEl.value = nd == null ? "off" : String(nd);
        }
        setSel(eLayoutEl, j.layout);
        setSel(eBlockSizeEl, j.blockSize);
        setSel(eTraversal, j.traversal);
        setSel(eKeymap, j.keymap);
        updateKeymapParams?.();
        if (j.keymap === "offset") {
          const kxEl = document.getElementById("ekx");
          const kyEl = document.getElementById("eky");
          if (kxEl) kxEl.value = j.kx ?? 0;
          if (kyEl) kyEl.value = j.ky ?? 0;
        }
        setSel(eBorderEl, j.border);
        // aspect
        if (Array.isArray(j.aspect)) {
          eAspect.value = "custom";
          eAspectWEl.value = j.aspect[0];
          eAspectHEl.value = j.aspect[1];
        } else setSel(eAspect, j.aspect || "original");
        eAspect.dispatchEvent(new Event("change"));
        // channel plan — explicit `channels` if present, else the simple default
        // (all R,G,B with `combine`); resolveConfig handles aligned auto-count.
        setSel(ePack, j.pack || "packed");
        const resolved = StegConfig.resolveConfig(j).encodeOpts;
        const plan = StegCore.normalizeChannelPlan(
          resolved,
          (parseInt(j.bits, 10) >> 3) || 3,
          0,
        );
        setChanPlan(plan.slots);
        updateLayoutVisibility?.();
        updateTravParams?.();
        updateReconLabel?.();
        // text entries — from job.entries (batch format) or job.texts (ui format)
        clearTextEntries();
        const textItems = Array.isArray(job.entries)
          ? job.entries.filter((e) => e.text != null)
          : Array.isArray(j.texts) ? j.texts : [];
        for (const t of textItems)
          typeof t === "string"
            ? addTextEntry("", t)
            : addTextEntry(t.name || "", t.text || "");
        // trim (ms) — only applies once audio is loaded; inputs are already ms
        if (encAudioBuf && j.start != null) {
          trimStartN.value = j.start;
          trimEndN.value =
            j.end != null ? j.end : Math.round(encAudioBuf.duration * 1000);
          applyManualTrim();
        }
      }

      // ── single-job export (jobs/*.json entry shape) ───────────────────
      // Serialize the form into one batch job: image/steg settings at the top
      // level, audio settings + texts nested in an ordered `entries` array (the
      // audio entry first, carrying `path`). image/out/audio paths come from the
      // selected job when one is loaded, else from the dropped filenames.
      function gatherJobJSON() {
        const selJob = jobSel >= 0 && jobsArray ? jobsArray[jobSel] : null;

        // top-level: image/out paths, then steg/image settings
        const job = {};
        const imagePath =
          selJob?.image || encImgFile?.name || encVideoFile?.name || null;
        if (imagePath) job.image = imagePath;
        if (selJob?.out) job.out = selJob.out;
        job.combine = representativeCombine();
        job.traversal = eTraversal.value;
        // traversal params — hyphenated to match the jobs/*.json convention
        if (eTraversal.value === "angle") {
          job["angle-a"] =
            parseInt(document.getElementById("eangle-a")?.value, 10) || 1;
          job["angle-b"] =
            parseInt(document.getElementById("eangle-b")?.value, 10) || 1;
        } else if (eTraversal.value === "fisher-yates") {
          const sv = document.getElementById("eFySeed")?.value.trim();
          if (sv) job.seed = parseInt(sv, 10) >>> 0;
        }
        job.keymap = eKeymap.value;
        if (eKeymap.value === "offset") {
          job.kx = parseInt(document.getElementById("ekx")?.value, 10) | 0;
          job.ky = parseInt(document.getElementById("eky")?.value, 10) | 0;
        }
        job.border = parseFloat(eBorderEl.value) || 0;
        job.aspect =
          eAspect.value === "custom"
            ? [parseFloat(eAspectWEl.value) || 16, parseFloat(eAspectHEl.value) || 9]
            : eAspect.value;
        // explicit channel plan only when it isn't the simple default — keeps
        // common jobs clean (just `combine`) and matches hand-authored JSON
        if (!isSimplePlan()) {
          const { pack, channels } = gatherChannelPlan();
          job.pack = pack;
          job.channels = channels;
        }

        // audio entry: `path` first (if known), then the audio settings.
        // layout/blockSize only matter for multi-channel / block layout.
        const ch = parseInt(eChEl.value) || 1;
        const layout = eLayoutEl.value;
        const audioPath =
          (selJob && jobAudioEntry(selJob)?.path) || encAudioName || null;
        const audioEntry = {};
        if (audioPath) audioEntry.path = audioPath;
        audioEntry.start = Math.round((trimAbsS || 0) * 1000);
        audioEntry.end = trimAbsE != null ? Math.round(trimAbsE * 1000) : null;
        audioEntry.sr = parseInt(eSrEl.value) || 22050;
        audioEntry.ch = ch;
        audioEntry.bits = parseInt(eBitsEl.value) || 16;
        audioEntry.dir = eDirEl.value;
        audioEntry.mode = eModeEl.value;
        audioEntry.normalize =
          eNormEl.value === "off" ? null : parseFloat(eNormEl.value);
        if (ch > 1) {
          audioEntry.layout = layout;
          if (layout === "block")
            audioEntry.blockSize = parseInt(eBlockSizeEl.value) || 64;
        }

        // text entries → { name, text }
        const textEntries = addlEntries
          .filter((e) => e.isText)
          .map((e) => ({ name: e.name || "", text: e.textEl ? e.textEl.value : "" }));

        job.entries = [audioEntry, ...textEntries];
        return job;
      }

      const copyJsonBtn = document.getElementById("copyJsonBtn");
      copyJsonBtn.addEventListener("click", async () => {
        const text = JSON.stringify(gatherJobJSON(), null, 2);
        let ok = false;
        try {
          await navigator.clipboard.writeText(text);
          ok = true;
        } catch (_) {
          // insecure/file:// context — fall back to a transient textarea
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
            document.body.appendChild(ta);
            ta.select();
            ok = document.execCommand("copy");
            ta.remove();
          } catch (_) {}
        }
        const prev = copyJsonBtn.textContent;
        copyJsonBtn.textContent = ok ? "copied ✓" : "copy failed";
        setTimeout(() => {
          copyJsonBtn.textContent = prev;
        }, 1200);
      });

      // ── jobs queue ────────────────────────────────────────────────────
      // Drop a jobs array → a clickable list. Selecting an item loads its
      // settings + texts into the form and auto-attaches any image/audio whose
      // filename matches a file you've dropped; "copy as json" exports it back.
      const jobsPanel = document.getElementById("jobsPanel");
      const jobsList = document.getElementById("jobsList");
      const jobsTitle = document.getElementById("jobsTitle");
      const jobsMsg = document.getElementById("jobsMsg");
      let jobsArray = null;
      let jobSel = -1;
      const droppedFiles = new Map(); // basename → File (for auto-attach)
      // set by selectJob before an audio attach so onAudioLoaded can re-apply the
      // job on top of the natural sr/ch/trim reset that decoding triggers
      let pendingJobConfig = null;

      const baseName = (p) => (p ? String(p).split(/[\\/]/).pop() : "");

      function stashDroppedFile(file) {
        droppedFiles.set(file.name, file);
        if (!jobsArray) return;
        renderJobsList(); // refresh availability ticks
        // if this completes a source for the selected job, (re)attach it now
        if (jobSel >= 0) {
          const { img, aud } = jobFilesStatus(jobsArray[jobSel]);
          if (file.name === img || file.name === aud) selectJob(jobSel);
        }
      }

      function loadJobsArray(arr) {
        jobsArray = arr.slice();
        jobSel = -1;
        jobsPanel.hidden = false;
        renderJobsList();
      }

      function jobAudioEntry(job) {
        return (Array.isArray(job.entries) ? job.entries : []).find(
          (e) => e.path && mimeFromFilename(e.path).startsWith("audio/"),
        ) || null;
      }

      function jobFilesStatus(job) {
        const img = baseName(job.image);
        const audioEnt = jobAudioEntry(job);
        const aud = audioEnt ? baseName(audioEnt.path) : baseName(job.audio);
        const haveImg = img && droppedFiles.has(img);
        const haveAud = aud && droppedFiles.has(aud);
        return { img, aud, haveImg, haveAud };
      }

      function renderJobsList() {
        jobsTitle.textContent = `jobs (${jobsArray.length})`;
        jobsList.innerHTML = "";
        jobsArray.forEach((job, i) => {
          const { img, aud, haveImg, haveAud } = jobFilesStatus(job);
          const row = document.createElement("div");
          row.className = "job-item" + (i === jobSel ? " sel" : "");
          const label = baseName(job.out) || img || `item ${i + 1}`;
          const audioEnt = jobAudioEntry(job);
          const meta = `${(audioEnt || job).bits || 16}b·${(audioEnt || job).ch || 1}ch·${job.combine || "xor"}`;
          row.innerHTML =
            `<span class="ji-idx">${i + 1}</span>` +
            `<span class="ji-name">${escHtml(label)}</span>` +
            `<span class="ji-meta">${escHtml(meta)}</span>` +
            `<span class="ji-files">` +
            `<span class="${haveImg ? "ji-ok" : "ji-miss"}" title="${escHtml(img || "no image")}">img</span> ` +
            `<span class="${haveAud ? "ji-ok" : "ji-miss"}" title="${escHtml(aud || "no audio")}">aud</span>` +
            `</span>`;
          row.addEventListener("click", () => selectJob(i));
          jobsList.appendChild(row);
        });
      }

      function selectJob(i) {
        jobSel = i;
